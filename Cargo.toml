[package]
name = "rbrowse"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A small local-first GTK4 and WebKitGTK Linux browser"
license = "MIT OR Apache-2.0"
default-run = "rbrowse"

[features]
default = ["webkit"]
webkit = ["dep:gtk4", "dep:libadwaita", "dep:webkit6"]

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"], optional = true }
libadwaita = { version = "0.9.2", features = ["v1_4", "gtk_v4_10"], optional = true }
webkit6 = { version = "0.6.1", features = ["v2_52"], optional = true }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = "1.0.151"
url = "2.5.7"
